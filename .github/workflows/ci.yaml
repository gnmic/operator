name: CI

on:
  workflow_dispatch:
  # Nightly run of every job, including the integration suites that do not run
  # on pull requests.
  schedule:
    - cron: '0 6 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'

env:
  GO_VERSION: '1.26.6'

jobs:
  # lint:
  #   name: Lint
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v7

  #     - name: Setup Go
  #       uses: actions/setup-go@v7
  #       with:
  #         go-version: ${{ env.GO_VERSION }}
  #         cache: true

  #     - name: Run golangci-lint
  #       uses: golangci/golangci-lint-action@v8
  #       with:
  #         version: v2.8.0

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: make test

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./cover.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        run: make build

      - name: Build Docker image
        run: make docker-build IMG=gnmic-operator:ci

  manifests:
    name: Verify Manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate manifests and sync Helm CRDs
        run: make manifests generate helm-crds

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated manifests or Helm CRDs are out of date. Please run 'make manifests generate helm-crds' and commit the changes."
            git diff
            exit 1
          fi

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run integration tests
        run: make run-integration-tests IMG=gnmic-operator:ci

  # Assertion-driven suites under test/integration/suite (gnmi-gen + kind gnmic-it).
  # Separate job/cluster from the containerlab lane above so both can run in parallel.
  #
  # Runs on pushes to main, nightly, and on demand -- not on pull requests: the
  # full sweep is 11 suites and ~20 minutes, and it builds the pinned collector
  # from source the first time a pin is seen.
  integration-test-v2:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    name: Integration Test v2
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # test.mk owns the pins; the workflow only reads them, so local runs and
      # CI test the same collector build.
      - name: Read collector pins
        id: pins
        run: make -s integration-pins >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.pins.outputs.gnmic_git_ref != ''
        uses: docker/setup-buildx-action@v4

      # The collector is built from a pinned openconfig/gnmic commit (see test.mk
      # GNMIC_GIT_REF) because 011-gnmi-server needs #995, which no release has
      # yet. Building here with the GitHub Actions layer cache means the compile
      # happens once per pin; later runs are a cache hit. `make` below sees the
      # image already present and skips its own build. When GNMIC_GIT_REF is
      # empty the pin is a registry tag and this step is skipped.
      - name: Build pinned collector image
        if: steps.pins.outputs.gnmic_git_ref != ''
        uses: docker/build-push-action@v7
        with:
          context: https://github.com/openconfig/gnmic.git#${{ steps.pins.outputs.gnmic_git_ref }}
          build-args: |
            GO_VERSION=${{ steps.pins.outputs.gnmic_go_version }}
            ALPINE_VERSION=${{ steps.pins.outputs.gnmic_alpine_version }}
          tags: ${{ steps.pins.outputs.gnmic_image }}
          load: true
          push: false
          cache-from: type=gha,scope=gnmic-${{ steps.pins.outputs.gnmic_git_ref }}
          cache-to: type=gha,mode=max,scope=gnmic-${{ steps.pins.outputs.gnmic_git_ref }}

      - name: Run integration tests v2
        run: make run-integration-tests-v2 IT_OPERATOR_IMG=gnmic-operator:ci
