# Default values for gnmic-operator

replicaCount: 1

image:
  repository: ghcr.io/gnmic/operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion
  # tag: "0.0.1"

imagePullSecrets: {}
nameOverride: ""
fullnameOverride: ""

## @param clusterDomain Cluster domain
##
clusterDomain: cluster.local

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - "ALL"

# Memory scales with the number of cached objects, not just Target count: the manager
# caches every Secret, ConfigMap, Service, StatefulSet and Certificate in the cluster.
# 256Mi is not enough for a few thousand Targets. Measure RSS in your own environment and
# raise these above the observed peak with headroom.
resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

# Kubernetes API client rate limits. The client-go defaults (20 QPS / 30 burst) throttle
# every controller in the process behind whichever one is busiest.
kubeApi:
  qps: 50
  burst: 100

# Namespaces to watch. Empty (the default) watches the whole cluster, which caches every
# Secret, ConfigMap, Service, StatefulSet and Certificate in it — Secrets in particular are
# unbounded and unrelated to how many Targets you have.
#
# Restricting this is the single largest reduction in memory footprint available. It is safe
# because the operator never resolves across namespaces: a Pipeline only ever uses Targets,
# Subscriptions, Outputs, Inputs and Processors from its own namespace, and credentials come
# from the Target's namespace.
#
# The ClusterRole is left cluster-scoped either way; narrowing it to a Role per namespace is
# a separate change.
#   watchNamespaces:
#     - network-telemetry
watchNamespaces: []

nodeSelector: {}

tolerations: []

affinity: {}

# Leader election configuration
leaderElection:
  enabled: true

# Webhook configuration
webhook:
  enabled: true
  port: 9443

# Metrics configuration
metrics:
  enabled: true
  port: 8080
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s

# Operator API endpoint configuration
# Set to a port number to enable, or empty to disable
api:
  port: 8082

# Health probes configuration
health:
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8081
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /readyz
      port: 8081
    initialDelaySeconds: 5
    periodSeconds: 10

# cert-manager integration
certManager:
  # Enable cert-manager for webhook certificates
  enabled: true
  # Issuer configuration (self-signed by default)
  issuer:
    create: true
    kind: Issuer
    name: ""  # If empty, uses the release name
  # Certificate duration
  duration: 8760h  # 1 year
  renewBefore: 720h  # 30 days

# Discovery configuration
discovery:
  # Maximum number of targets/events sent in a single discovery message
  chunkSize: 100
  # Amount of discovery messages that can be queued in the channel buffer
  bufferSize: 10

# Install CRDs with the chart
crds:
  install: true
  # Keep CRDs on uninstall
  keep: true
