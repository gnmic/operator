  names:
    kind: TargetSource
    listKind: TargetSourceList
    plural: targetsources
    singular: targetsource
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.source.type
      name: Type
      type: string
    - jsonPath: .status.managed
      name: Targets
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .status.lastSuccessfulSyncTime
      name: Last Sync
      type: date
    - jsonPath: .spec.suspend
      name: Suspended
      priority: 1
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TargetSource is the Schema for the targetsources API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TargetSourceSpec describes where to load targets from and what to do with them.

              A TargetSource reads devices from an external system on every run, turns them
              into Target resources, and removes Targets whose device is gone. Everything
              that is not specific to one kind of source lives outside Source, because it
              means the same thing for every provider.
            properties:
              interval:
                default: 5m
                description: |-
                  Interval between two discovery runs, after a successful run.
                  A random jitter of up to 10% is added so that many TargetSources
                  created at the same time do not poll at the same time.
                  After a failure the next run is scheduled with a backoff that starts at
                  Interval, doubles on each consecutive failure, and is capped at ten
                  times Interval.
                type: string
                x-kubernetes-validations:
                - message: interval must be at least 10s
                  rule: duration(self) >= duration('10s')
              maxTargets:
                default: 10000
                description: |-
                  MaxTargets caps how many Targets this source may manage. A run that
                  discovers more is rejected as a whole, so a broken query cannot create
                  tens of thousands of resources. 0 means no limit.
                format: int32
                minimum: 0
                type: integer
              prune:
                description: |-
                  Prune controls when Targets whose device is no longer returned by the
                  source may be deleted.
                properties:
                  allowEmptySource:
                    default: false
                    description: |-
                      AllowEmptySource decides whether a source that returns zero devices is
                      a valid answer. When false (the default), an empty result prunes
                      nothing and the run reports Ready=False with reason EmptySource.
                    type: boolean
                  maxDeleteRatio:
                    default: 50
                    description: |-
                      MaxDeleteRatio is the largest share of currently managed Targets that
                      one run may remove, as a percentage. A run that wants to remove more
                      applies its creates and updates, skips all deletions, and reports why.
                      This stops a truncated or misconfigured response from wiping an
                      inventory. Set to 100 to disable the guard, or 0 to hold every deletion.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                type: object
              source:
                description: Source describes the external system to read devices
                  from.
                properties:
                  configMap:
                    description: ConfigMap reads devices from a ConfigMap in the TargetSource
                      namespace.
                    properties:
                      key:
                        description: |-
                          Key to read. When empty, every key is read and the results are
                          concatenated, so an inventory can be split across keys.
                        type: string
                      mapping:
                        description: |-
                          Mapping says how to read the document. Omit it when the document is
                          the native list.
                        properties:
                          address:
                            description: |-
                              Address must return a non-empty string, an IP or a hostname without a
                              port. Defaults to item.address.
                            type: string
                          items:
                            description: |-
                              Items selects the list of device objects. It runs once against self
                              and must return a list. When empty, the document itself must be a list.
                              Example: "self.results"
                            type: string
                          labels:
                            description: Labels must return a map. Defaults to item.labels.
                            type: string
                          name:
                            description: Name must return a non-empty string. Defaults
                              to item.name.
                            type: string
                          onError:
                            default: Skip
                            description: |-
                              OnError decides what happens when an expression fails for one device.
                              Skip drops that device and counts it in status.invalid; Fail fails the
                              whole run. Either way the failure is reported, never silent.
                            enum:
                            - Skip
                            - Fail
                            type: string
                          port:
                            description: |-
                              Port must return an int or a numeric string. Defaults to item.port,
                              then to spec.target.port.
                            type: string
                          profile:
                            description: |-
                              Profile must return a string. Defaults to item.profile, then to
                              spec.target.profile.
                            type: string
                        type: object
                      name:
                        description: Name of the ConfigMap or Secret.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  http:
                    description: HTTP reads devices from a remote HTTP API.
                    properties:
                      auth:
                        description: Auth authenticates the request.
                        properties:
                          basic:
                            description: Basic sends HTTP Basic credentials.
                            properties:
                              passwordKey:
                                default: password
                                type: string
                              secretRef:
                                description: |-
                                  SecretRef names a Secret holding "username" and "password" keys. The
                                  key names can be overridden with UsernameKey and PasswordKey.
                                properties:
                                  name:
                                    minLength: 1
                                    type: string
                                required:
                                - name
                                type: object
                              usernameKey:
                                default: username
                                type: string
                            required:
                            - secretRef
                            type: object
                          header:
                            description: |-
                              Header sends a secret value in an arbitrary header, for APIs that use
                              neither Basic nor a bearer scheme.
                            properties:
                              name:
                                description: Name of the header.
                                minLength: 1
                                type: string
                              secretRef:
                                description: SecretRef names the Secret key holding
                                  the header value.
                                properties:
                                  key:
                                    minLength: 1
                                    type: string
                                  name:
                                    minLength: 1
                                    type: string
                                required:
                                - key
                                - name
                                type: object
                            required:
                            - name
                            - secretRef
                            type: object
                          token:
                            description: Token sends "<scheme> <token>" in the Authorization
                              header.
                            properties:
                              scheme:
                                default: Bearer
                                description: |-
                                  Scheme prefixed to the token in the Authorization header.
                                  NetBox uses "Token", most others use "Bearer".
                                minLength: 1
                                type: string
                              secretRef:
                                description: SecretRef names the Secret key holding
                                  the token.
                                properties:
                                  key:
                                    minLength: 1
                                    type: string
                                  name:
                                    minLength: 1
                                    type: string
                                required:
                                - key
                                - name
                                type: object
                            required:
                            - secretRef
                            type: object
                        type: object
                        x-kubernetes-validations:
                        - message: exactly one of the fields in [basic token header]
                            must be set
                          rule: '[has(self.basic),has(self.token),has(self.header)].filter(x,x==true).size()
                            == 1'
                      body:
                        description: Body is sent for POST only.
                        type: string
                      headers:
                        additionalProperties:
                          type: string
                        description: Headers added to every request. Authentication
                          headers set by Auth win.
                        type: object
                      mapping:
                        description: |-
                          Mapping says how to read the response. Omit it when the endpoint
                          returns the native list: a JSON or YAML array of objects with name,
                          address, port, profile and labels.
                        properties:
                          address:
                            description: |-
                              Address must return a non-empty string, an IP or a hostname without a
                              port. Defaults to item.address.
                            type: string
                          items:
                            description: |-
                              Items selects the list of device objects. It runs once against self
                              and must return a list. When empty, the document itself must be a list.
                              Example: "self.results"
                            type: string
                          labels:
                            description: Labels must return a map. Defaults to item.labels.
                            type: string
                          name:
                            description: Name must return a non-empty string. Defaults
                              to item.name.
                            type: string
                          onError:
                            default: Skip
                            description: |-
                              OnError decides what happens when an expression fails for one device.
                              Skip drops that device and counts it in status.invalid; Fail fails the
                              whole run. Either way the failure is reported, never silent.
                            enum:
                            - Skip
                            - Fail
                            type: string
                          port:
                            description: |-
                              Port must return an int or a numeric string. Defaults to item.port,
                              then to spec.target.port.
                            type: string
                          profile:
                            description: |-
                              Profile must return a string. Defaults to item.profile, then to
                              spec.target.profile.
                            type: string
                        type: object
                      method:
                        default: GET
                        description: Method is the HTTP method.
                        enum:
                        - GET
                        - POST
                        type: string
                      pagination:
                        description: Pagination follows a multi-page response.
                        properties:
                          maxPages:
                            default: 100
                            description: |-
                              MaxPages bounds one run. Reaching it marks the result truncated, so
                              nothing is pruned from an incomplete read, and the run reports it.
                            format: int32
                            minimum: 1
                            type: integer
                          nextField:
                            description: |-
                              NextField is a CEL expression over self returning the next page as a
                              full URL, or an opaque token, or null to stop.
                            type: string
                          requestParam:
                            description: |-
                              RequestParam is the query parameter used when NextField returns a
                              token rather than a URL.
                            type: string
                        type: object
                      tls:
                        description: TLS applies to https URLs only.
                        properties:
                          caBundleRef:
                            description: CABundleRef points at a ConfigMap key holding
                              PEM-encoded CAs.
                            properties:
                              key:
                                minLength: 1
                                type: string
                              name:
                                minLength: 1
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          clientCertRef:
                            description: ClientCertRef points at a kubernetes.io/tls
                              Secret for mutual TLS.
                            properties:
                              name:
                                minLength: 1
                                type: string
                            required:
                            - name
                            type: object
                          insecureSkipVerify:
                            default: false
                            description: InsecureSkipVerify disables server certificate
                              verification.
                            type: boolean
                        type: object
                      url:
                        description: URL of the remote API. Must be http or https.
                        type: string
                        x-kubernetes-validations:
                        - message: url must start with http:// or https://
                          rule: self.startsWith('http://') || self.startsWith('https://')
                    required:
                    - url
                    type: object
                  secret:
                    description: Secret reads devices from a Secret in the TargetSource
                      namespace.
                    properties:
                      key:
                        description: |-
                          Key to read. When empty, every key is read and the results are
                          concatenated, so an inventory can be split across keys.
                        type: string
                      mapping:
                        description: |-
                          Mapping says how to read the document. Omit it when the document is
                          the native list.
                        properties:
                          address:
                            description: |-
                              Address must return a non-empty string, an IP or a hostname without a
                              port. Defaults to item.address.
                            type: string
                          items:
                            description: |-
                              Items selects the list of device objects. It runs once against self
                              and must return a list. When empty, the document itself must be a list.
                              Example: "self.results"
                            type: string
                          labels:
                            description: Labels must return a map. Defaults to item.labels.
                            type: string
                          name:
                            description: Name must return a non-empty string. Defaults
                              to item.name.
                            type: string
                          onError:
                            default: Skip
                            description: |-
                              OnError decides what happens when an expression fails for one device.
                              Skip drops that device and counts it in status.invalid; Fail fails the
                              whole run. Either way the failure is reported, never silent.
                            enum:
                            - Skip
                            - Fail
                            type: string
                          port:
                            description: |-
                              Port must return an int or a numeric string. Defaults to item.port,
                              then to spec.target.port.
                            type: string
                          profile:
                            description: |-
                              Profile must return a string. Defaults to item.profile, then to
                              spec.target.profile.
                            type: string
                        type: object
                      name:
                        description: Name of the ConfigMap or Secret.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  static:
                    description: Static lists the devices inline.
                    properties:
                      devices:
                        description: Devices is the inventory.
                        items:
                          description: StaticDevice is one inline device.
                          properties:
                            address:
                              description: Address is an IP or hostname without a
                                port.
                              minLength: 1
                              type: string
                            labels:
                              additionalProperties:
                                type: string
                              description: Labels are added to the Target.
                              type: object
                            name:
                              description: Name of the device as the source knows
                                it.
                              minLength: 1
                              type: string
                            port:
                              description: Port overrides spec.target.port for this
                                device.
                              format: int32
                              maximum: 65535
                              minimum: 1
                              type: integer
                            profile:
                              description: Profile overrides spec.target.profile for
                                this device.
                              type: string
                          required:
                          - address
                          - name
                          type: object
                        minItems: 1
                        type: array
                    required:
                    - devices
                    type: object
                  type:
                    description: Type names the provider.
                    enum:
                    - HTTP
                    - Static
                    - ConfigMap
                    - Secret
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: http must be set if and only if type is HTTP
                  rule: has(self.http) == (self.type == 'HTTP')
                - message: static must be set if and only if type is Static
                  rule: has(self.static) == (self.type == 'Static')
                - message: configMap must be set if and only if type is ConfigMap
                  rule: has(self.configMap) == (self.type == 'ConfigMap')
                - message: secret must be set if and only if type is Secret
                  rule: has(self.secret) == (self.type == 'Secret')
              suspend:
                default: false
                description: |-
                  Suspend stops discovery. Targets already created are left alone.
                  Use it to freeze a source without deleting anything.
                type: boolean
              target:
                description: Target controls how a discovered device becomes a Target
                  resource.
                properties:
                  labels:
                    additionalProperties:
                      type: string
                    description: |-
                      Labels added to every Target. Labels from the source win on conflict,
                      except for the reserved operator labels.
                    type: object
                  port:
                    default: 57400
                    description: Port used when the source does not supply one.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  profile:
                    description: |-
                      Profile is the TargetProfile name used when the source does not supply
                      one. It must exist in the same namespace.
                    type: string
                type: object
              timeout:
                default: 1m
                description: |-
                  Timeout for a single discovery run, including all pages. A timeout
                  longer than Interval is capped at Interval, so a short interval needs no
                  matching timeout.
                type: string
                x-kubernetes-validations:
                - message: timeout must be at least 1s
                  rule: duration(self) >= duration('1s')
              webhook:
                description: |-
                  Webhook enables an endpoint the source can call to request an
                  immediate run.
                properties:
                  auth:
                    description: |-
                      Auth is required when Enabled is true. An unauthenticated endpoint
                      would let anyone who can reach the API port drive fetches against the
                      source at the debounce rate.
                    properties:
                      bearer:
                        description: Bearer compares the Authorization header against
                          a Secret value.
                        properties:
                          secretRef:
                            description: SecretRef names the Secret key holding the
                              expected token.
                            properties:
                              key:
                                minLength: 1
                                type: string
                              name:
                                minLength: 1
                                type: string
                            required:
                            - key
                            - name
                            type: object
                        required:
                        - secretRef
                        type: object
                      signature:
                        description: Signature verifies an HMAC over the raw request
                          body.
                        properties:
                          algorithm:
                            default: sha256
                            description: Algorithm is the HMAC hash.
                            enum:
                            - sha256
                            - sha512
                            type: string
                          header:
                            default: X-Hook-Signature
                            description: |-
                              Header carries the hex-encoded signature, optionally prefixed with
                              "<algorithm>=".
                            minLength: 1
                            type: string
                          secretRef:
                            description: SecretRef names the Secret key holding the
                              HMAC secret.
                            properties:
                              key:
                                minLength: 1
                                type: string
                              name:
                                minLength: 1
                                type: string
                            required:
                            - key
                            - name
                            type: object
                        required:
                        - secretRef
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: at least one of the fields in [bearer signature] must
                        be set
                      rule: '[has(self.bearer),has(self.signature)].filter(x,x==true).size()
                        >= 1'
                  debounce:
                    default: 5s
                    description: |-
                      Debounce collapses a burst of calls into a single run. A call within
                      this window of the previous one does not schedule another run.
                    type: string
                  enabled:
                    default: false
                    description: Enabled turns the endpoint on.
                    type: boolean
                required:
                - enabled
                type: object
                x-kubernetes-validations:
                - message: webhook.auth is required when the webhook is enabled
                  rule: '!self.enabled || has(self.auth)'
            required:
            - source
            type: object
          status:
            description: TargetSourceStatus is written once per run, at the end.
            properties:
              conditions:
                description: 'Conditions: Ready, Reconciling, Stalled, Conflicted.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              conflicted:
                description: Conflicted counts wanted names owned by something else.
                format: int32
                type: integer
              consecutiveFailures:
                description: ConsecutiveFailures drives the retry backoff.
                format: int32
                type: integer
              discovered:
                description: |-
                  Discovered is how many devices the source returned on the last run.
                  The counters are not omitempty so a zero shows as 0 in kubectl output
                  rather than as an absent field.
                format: int32
                type: integer
              failedDevices:
                description: |-
                  FailedDevices samples devices the last run could not turn into a
                  Target, with the reason. Capped at 10 entries.
                items:
                  description: FailedDevice is one device the last run could not turn
                    into a Target.
                  properties:
                    name:
                      description: Name as the source reported it.
                      type: string
                    reason:
                      description: Reason is a short machine-readable cause.
                      type: string
                  required:
                  - reason
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              invalid:
                description: Invalid counts devices the last run could not turn into
                  a Target.
                format: int32
                type: integer
              lastError:
                description: LastError is the error from the last failed run, cleared
                  on success.
                type: string
              lastSuccessfulSyncTime:
                description: LastSuccessfulSyncTime is when a run last finished successfully.
                format: date-time
                type: string
              lastSyncTime:
                description: LastSyncTime is when a run last finished, successfully
                  or not.
                format: date-time
                type: string
              managed:
                description: Managed is how many Targets this TargetSource owns right
                  now.
                format: int32
                type: integer
              nextSyncTime:
                description: NextSyncTime is when the next run is scheduled.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  describes.
                format: int64
                type: integer
              pruned:
                description: Pruned counts Targets removed by the last run.
                format: int32
                type: integer
              sanitized:
                description: |-
                  Sanitized counts devices whose labels had to be rewritten to be valid.
                  The originals are kept as annotations on the Target.
                format: int32
                type: integer
              sourceDigest:
                description: |-
                  SourceDigest is a stable, order-independent hash of the last
                  successful result. It is informational: it tells a human whether the
                  source moved between two runs. The controller does not branch on it.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
