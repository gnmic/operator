apiVersion: v1
kind: Service
metadata:
  name: gnmi-gen
  namespace: {{ .Namespace }}
  labels:
    app: gnmi-gen
spec:
  # Headless on purpose. DNS resolves straight to the pod IP, so collectors can
  # dial any simulated target port without it being enumerated here. A ClusterIP
  # Service would require one entry per simulated target.
  clusterIP: None
  selector:
    app: gnmi-gen
  ports:
    - name: api
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gnmi-gen
  namespace: {{ .Namespace }}
  labels:
    app: gnmi-gen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gnmi-gen
  template:
    metadata:
      labels:
        app: gnmi-gen
      annotations:
        gnmi-gen.config/hash: "{{ .ConfigHash }}"
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: gnmi-gen
          image: {{ .GnmiGenImage }}
          imagePullPolicy: IfNotPresent
          args: ["--config", "/config/gnmi-gen.yaml"]
          ports:
            - name: api
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /config
{{- if .TLSSecret }}
            - name: tls
              mountPath: /tls
              readOnly: true
{{- end }}
          readinessProbe:
            httpGet:
              path: /api/v1/targets
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 2
            # Scale suites expand hundreds of servers; give the pod time to bind.
            failureThreshold: 90
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: gnmi-gen-config
{{- if .TLSSecret }}
        - name: tls
          secret:
            secretName: {{ .TLSSecret }}
{{- end }}
