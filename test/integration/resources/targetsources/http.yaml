apiVersion: operator.gnmic.dev/v1alpha1
kind: TargetSource
metadata:
  name: http-ts
spec:
  interval: 1m
  source:
    type: HTTP
    http:
      url: http://http-svc.default.svc/targets.json
  target:
    profile: default
    labels:
      integrationtest: http
  webhook:
    enabled: true
    auth:
      signature:
        secretRef:
          name: gnmic-signature
          key: signature
        header: x-hook-signature
        algorithm: sha512
