apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gnmi-gen-server
spec:
  secretName: gnmi-gen-server-tls
  commonName: gnmi-gen
  dnsNames:
    - gnmi-gen
    - gnmi-gen.{{ .Namespace }}
    - gnmi-gen.{{ .Namespace }}.svc
    - gnmi-gen.{{ .Namespace }}.svc.cluster.local
    - {{ .GnmiGenHost }}
  usages:
    - server auth
    - digital signature
    - key encipherment
  issuerRef:
    name: suite-ca-issuer
    kind: Issuer
