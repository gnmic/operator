# Shared props for 003-targets. Target CRs are created per test.
apiVersion: v1
kind: Secret
metadata:
  name: sim-credentials
stringData:
  username: gnmic
  password: gnmic
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: TargetProfile
metadata:
  name: default
spec:
  credentialsRef: sim-credentials
  encoding: JSON_IETF
  timeout: 10s
  tls: {}
  retryTimer: 2s
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: Cluster
metadata:
  name: c1
spec:
  image: {{ .GnmicImage }}
  replicas: 1
  api:
    restPort: 7890
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: Subscription
metadata:
  name: if-counters
  labels:
    suite: "003"
spec:
  mode: STREAM/SAMPLE
  sampleInterval: 1s
  encoding: JSON_IETF
  paths:
    - /interface/statistics/in-octets
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: Output
metadata:
  name: prom
  labels:
    suite: "003"
spec:
  type: prometheus
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: Pipeline
metadata:
  name: collect
spec:
  clusterRef: c1
  enabled: true
  targetSelectors:
    - matchLabels:
        vendor: gnmi-gen
  subscriptionSelectors:
    - matchLabels:
        suite: "003"
  outputs:
    outputSelectors:
      - matchLabels:
          suite: "003"
