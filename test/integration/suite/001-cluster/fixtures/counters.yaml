# Two targets, three subscriptions, one output: shapes the status counters
# asserted by 001-7 so that every counter has a distinct expected value.
apiVersion: operator.gnmic.dev/v1alpha1
kind: Target
metadata:
  name: {{ .Tag }}-leaf1
  labels:
    tag: {{ .Tag }}
spec:
  address: {{ .GnmiGenHost }}:57400
  profile: default
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: Target
metadata:
  name: {{ .Tag }}-leaf2
  labels:
    tag: {{ .Tag }}
spec:
  address: {{ .GnmiGenHost }}:57401
  profile: default
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: Subscription
metadata:
  name: {{ .Tag }}-if
  labels:
    tag: {{ .Tag }}
spec:
  mode: STREAM/SAMPLE
  sampleInterval: 1s
  encoding: JSON_IETF
  paths:
    - /interface/statistics/in-octets
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: Subscription
metadata:
  name: {{ .Tag }}-cpu
  labels:
    tag: {{ .Tag }}
spec:
  mode: STREAM/SAMPLE
  sampleInterval: 2s
  encoding: JSON_IETF
  paths:
    - /platform/control/process
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: Subscription
metadata:
  name: {{ .Tag }}-sys
  labels:
    tag: {{ .Tag }}
spec:
  mode: STREAM/SAMPLE
  sampleInterval: 10s
  encoding: JSON_IETF
  paths:
    - /system/name
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: Output
metadata:
  name: {{ .Tag }}-sink
  labels:
    tag: {{ .Tag }}
spec:
  type: file
  config:
    filename: /tmp/{{ .Tag }}.json
    format: event
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: Pipeline
metadata:
  name: {{ .Tag }}
spec:
  clusterRef: {{ .Cluster }}
  enabled: true
  targetSelectors:
    - matchLabels:
        tag: {{ .Tag }}
  subscriptionSelectors:
    - matchLabels:
        tag: {{ .Tag }}
  outputs:
    outputSelectors:
      - matchLabels:
          tag: {{ .Tag }}
