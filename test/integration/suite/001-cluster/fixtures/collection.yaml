# A minimal amount of collection work bound to one cluster.
#
# Every object is labelled with .Tag and the pipeline selects on that label, so
# tests sharing this namespace never pick up each other's resources.
apiVersion: operator.gnmic.dev/v1alpha1
kind: Target
metadata:
  name: {{ .Tag }}-leaf1
  labels:
    tag: {{ .Tag }}
spec:
  address: {{ .GnmiGenHost }}:57400
  profile: default
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: Subscription
metadata:
  name: {{ .Tag }}-if
  labels:
    tag: {{ .Tag }}
spec:
  mode: STREAM/SAMPLE
  sampleInterval: 1s
  encoding: JSON_IETF
  paths:
    - /interface/statistics/in-octets
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: Output
metadata:
  name: {{ .Tag }}-sink
  labels:
    tag: {{ .Tag }}
spec:
  type: file
  config:
    filename: /tmp/{{ .Tag }}.json
    format: event
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: Pipeline
metadata:
  name: {{ .Tag }}
spec:
  clusterRef: {{ .Cluster }}
  enabled: true
  targetSelectors:
    - matchLabels:
        tag: {{ .Tag }}
  subscriptionSelectors:
    - matchLabels:
        tag: {{ .Tag }}
  outputs:
    outputSelectors:
      - matchLabels:
          tag: {{ .Tag }}
