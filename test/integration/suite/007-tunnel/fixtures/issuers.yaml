# Suite-local cert-manager issuer chain. selfsigned-issuer bootstraps the CA;
# suite-ca-issuer signs the Cluster's tunnel server certificate
# (spec.grpcTunnel.tls.issuerRef). Applied before gnmi-gen so the Issuer is
# Ready when the baseline Cluster asks for certificates.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: suite-ca
spec:
  isCA: true
  commonName: suite-ca
  secretName: suite-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: suite-ca-issuer
spec:
  ca:
    secretName: suite-ca-secret
