apiVersion: v1
kind: Secret
metadata:
  name: sim-credentials
stringData:
  username: gnmic
  password: gnmic
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: TargetProfile
metadata:
  name: default
spec:
  credentialsRef: sim-credentials
  encoding: JSON_IETF
  timeout: 10s
  # An empty tls block means TLS with verification skipped, which matches
  # gnmi-gen's self-signed listeners.
  tls: {}
  retryTimer: 2s
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: Cluster
metadata:
  name: spike
spec:
  image: {{ .GnmicImage }}
  replicas: 1
  api:
    restPort: 7890
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: Subscription
metadata:
  name: if-counters
  labels:
    suite: spike
spec:
  mode: STREAM/SAMPLE
  sampleInterval: 1s
  encoding: JSON_IETF
  paths:
    - /interface/statistics/in-octets
---
# A pipeline is rejected without an output. A file output keeps the spike
# focused on collection rather than on an output's own plumbing.
apiVersion: operator.gnmic.dev/v1alpha1
kind: Output
metadata:
  name: sink
  labels:
    suite: spike
spec:
  type: file
  config:
    filename: /tmp/spike-output.json
    format: event
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: Target
metadata:
  name: leaf1
  labels:
    suite: spike
spec:
  address: {{ .GnmiGenHost }}:57400
  profile: default
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: Target
metadata:
  name: leaf2
  labels:
    suite: spike
spec:
  address: {{ .GnmiGenHost }}:57401
  profile: default
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: Pipeline
metadata:
  name: spike
spec:
  clusterRef: spike
  enabled: true
  targetSelectors:
    - matchLabels:
        suite: spike
  subscriptionSelectors:
    - matchLabels:
        suite: spike
  outputs:
    outputSelectors:
      - matchLabels:
          suite: spike
