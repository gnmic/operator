apiVersion: operator.gnmic.dev/v1alpha1
kind: Processor
metadata:
  name: {{ .Name }}
  labels:
    suite: "006"
{{- if .Chain }}
    chain: {{ .Chain }}
{{- end }}
spec:
  type: event-jq
  config:
    # condition is evaluated per event (single object), not the notification array.
    condition: '.tags.stage != null'
    expression: '.[] |= (.tags.stage = "second")'
