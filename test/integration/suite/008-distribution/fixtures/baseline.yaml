apiVersion: v1
kind: Secret
metadata:
  name: sim-credentials
stringData:
  username: gnmic
  password: gnmic
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: TargetProfile
metadata:
  name: default
spec:
  credentialsRef: sim-credentials
  encoding: JSON_IETF
  timeout: 10s
  tls: {}
  retryTimer: 2s
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: Subscription
metadata:
  name: if-counters
  labels:
    suite: "008"
spec:
  mode: STREAM/SAMPLE
  sampleInterval: 1s
  encoding: JSON_IETF
  paths:
    - /interface/statistics/in-octets
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: Output
metadata:
  name: sink
  labels:
    suite: "008"
spec:
  type: file
  config:
    filename: /tmp/008-sink.json
    format: event
---
apiVersion: operator.gnmic.dev/v1alpha1
kind: Target
metadata:
  name: dev1
  labels:
    suite: "008"
spec:
  address: {{ .GnmiGenHost }}:57400
  profile: default
---
